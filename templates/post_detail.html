<!-- templates/post_detail.html-->
 {% extends 'base.html' %}

 {% block content %}
    <div class="row">
      <div class="col-md-8 mx-auto">
        {% if post.image %}
          <img src="{{ post.image.url }}" class="card-img-top" alt="{{ post.text|truncatechars:50 }}" style="max-height: 500px; object-fit: cover;">
        {% endif %}
        <div class="card-body">  
          <h1 class="card-title mb-3">{{ post.text }}</h1>
          <p class="text-muted mb-4">
            <strong>Autor:</strong> {{ post.author }}
          </p>

          <hr>

          <div class="d-flex justify-content-between align-items-center mt-4">
            <a href="{% url 'home' %}" class="btn btn-secondary">&larr; Volveral inicio</a>
            
            <div>
              {% if can_edit %}
                <a href="{% url 'post_edit' post.pk %}" class="btn btn-outline-primary me-2">Editar</a>
              {% endif %}

              {% if can_delete %}
                <a href="{% url 'post_delete' post.pk %}" class="btn btn-outline-danger">Eliminar</a>
              {% endif %}
            </div>
          </div>
        </div>
      </div>
    </div>
 {% endblock content %}
